name: Salesforce readonly extract

on:
  schedule:
    - cron: "0,30 9-19 * * 1-5"
      timezone: "Europe/Paris"
  workflow_dispatch:
    inputs:
      period:
        description: Exercice a extraire
        required: true
        default: both
        type: choice
        options:
          - current
          - previous
          - both

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PERIOD: ${{ github.event_name == 'schedule' && 'current' || inputs.period }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Salesforce extractor
        env:
          SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_API_VERSION: ${{ vars.SF_API_VERSION || 'v66.0' }}
        run: python -m src.main --period "$PERIOD"

      - name: Build Excel dry-run plan
        if: ${{ env.PERIOD == 'current' }}
        run: python -m src.excel_plan

      - name: Send plan to Power Automate
        if: ${{ env.PERIOD == 'current' }}
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          test -n "$POWER_AUTOMATE_URL" || (echo "Missing POWER_AUTOMATE_URL secret" && exit 1)
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @excel-write-plan.json \
            "$POWER_AUTOMATE_URL")
          echo "Power Automate response:"
          echo "$RESPONSE"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-results
          path: |
            results.json
            excel-write-plan.json
          if-no-files-found: error
          retention-days: 7
